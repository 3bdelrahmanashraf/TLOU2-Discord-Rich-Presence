<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TLOU2 Discord Rich Presence</title>
<style>
  :root {
    --bg: #07090b;
    --card: #232428;
    --text: #f2f3f5;
    --muted: #b1b7c0;
    --dim: #7d858f;
    --blurple: #5865f2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: var(--bg);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

  .figure { position: absolute; left: -70px; top: 0; width: 1210px; height: 1080px; }
  .figure img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 52% 26%;
    opacity: .96;
  }

  .shade-right {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(7,9,11,0) 46%, rgba(7,9,11,.85) 68%, #07090b 78%);
  }
  .shade-bottom {
    position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(4,5,7,.97) 0%, rgba(4,5,7,.75) 18%, rgba(4,5,7,0) 42%);
  }
  .shade-left {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(4,5,7,.55) 0%, rgba(4,5,7,0) 20%);
  }
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(760px 620px at 79% 47%, rgba(88,101,242,.16), rgba(88,101,242,0) 70%);
  }
  .vignette {
    position: absolute; inset: 0;
    box-shadow: inset 0 0 220px 60px rgba(0,0,0,.75);
  }

  .copy { position: absolute; left: 110px; bottom: 96px; width: 820px; }
  .kicker {
    font-size: 17px; font-weight: 600; letter-spacing: .26em;
    color: #98a1ab; text-transform: uppercase; margin-bottom: 22px;
  }
  h1 {
    margin: 0; font-size: 96px; line-height: .94; font-weight: 800;
    letter-spacing: -.022em; text-transform: uppercase;
    text-shadow: 0 8px 40px rgba(0,0,0,.55);
  }
  h1 span { display: block; }
  .sub {
    margin: 26px 0 0; font-size: 25px; line-height: 1.4;
    color: #c6ccd4; max-width: 640px; font-weight: 400;
  }
  /* Discord "playing a game" activity block */
  .card {
    position: absolute; left: 1110px; top: 452px;
    width: 560px; border-radius: 14px; overflow: hidden;
    background: var(--card);
    padding: 24px 0 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.055);
  }
  .playing-label {
    padding: 0 26px 12px; font-size: 12px; font-weight: 700;
    letter-spacing: .06em; color: var(--muted); text-transform: uppercase;
  }
  .activity { display: flex; gap: 16px; padding: 0 26px; }
  .thumb-wrap { position: relative; width: 84px; height: 84px; flex: 0 0 84px; }
  .thumb {
    width: 84px; height: 84px; border-radius: 8px;
    background-image: url("../assets/raw/tlou2.png");
    background-size: cover; background-position: 50% 14%;
  }
  .mini {
    position: absolute; right: -7px; bottom: -7px;
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid var(--card);
    background-image: url("../assets/ellie.png");
    background-size: cover; background-position: 50% 26%;
  }
  .lines { min-width: 0; padding-top: 2px; }
  .game { font-size: 17px; font-weight: 700; }
  .l1, .l2 { font-size: 15px; color: var(--muted); margin-top: 5px; white-space: nowrap; }
  .l2 { color: #cdd3db; }
  .ellapsed { font-size: 14px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<div id="stage">
  <div class="figure"><img src="../pngs/Part_II_Ellie_infobox.png" alt=""></div>
  <div class="glow"></div>
  <div class="shade-right"></div>
  <div class="shade-left"></div>
  <div class="shade-bottom"></div>
  <div class="vignette"></div>

  <div class="copy">
    <div class="kicker">Discord Rich Presence</div>
    <h1><span>The Last of Us</span><span>Part II</span></h1>
    <p class="sub">Your chapter, who you are playing as, difficulty and collectibles &mdash; live on your Discord profile while you play.</p>
  </div>

  <div class="card">
    <div class="playing-label">Playing a game</div>
    <div class="activity">
      <div class="thumb-wrap">
        <div class="thumb"></div>
        <div class="mini"></div>
      </div>
      <div class="lines">
        <div class="game">The Last of Us Part II</div>
        <div class="l1">Seattle Day 2 &middot; Hillcrest</div>
        <div class="l2">Playing as Ellie &middot; Moderate &middot; 23 collectibles</div>
        <div class="ellapsed">02:14:07 elapsed</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
